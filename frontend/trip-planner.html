
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrekSmart | Trip Planner</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="planner-header">
    <a href="index.html" class="logo">🏔️ TrekSmart</a>
    <a href="index.html" class="home-link">← Back to Dashboard</a>
</header>

<main class="planner-page">

    <div class="planner-intro">
        <span class="section-tag">YOUR NEXT ADVENTURE</span>
        <h1>Plan Your Perfect Trek</h1>
        <p>Customize your journey and create your trekking itinerary.</p>
    </div>

    <section class="planner-section">

        <div class="planner-title">
            <h2>🧭 Trip Details</h2>
            <p>Enter your travel preferences below.</p>
        </div>

        <form id="tripForm" class="planner-form">

            <div class="form-group">
                <label for="destination">Trekking Destination</label>
                <input type="text" id="destination"
                       placeholder="Example: Kudremukh Peak" required>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="startDate">Travel Start Date</label>
                    <input type="date" id="startDate" required>
                </div>

                <div class="form-group">
                    <label for="endDate">Travel End Date</label>
                    <input type="date" id="endDate" required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="travellers">Number of Travellers</label>
                    <input type="number" id="travellers"
                           min="1" max="50" value="1" required>
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty Preference</label>
                    <select id="difficulty" required>
                        <option value="">Select Difficulty</option>
                        <option value="Easy">Easy</option>
                        <option value="Moderate">Moderate</option>
                        <option value="Difficult">Difficult</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label for="transport">Transport Preference</label>
                <select id="transport">
                    <option value="Car">Car</option>
                    <option value="Bike">Bike</option>
                    <option value="Public Transport">Public Transport</option>
                </select>
            </div>

            <button type="submit" id="generatePlanBtn">
                Generate My Trip Plan →
            </button>

        </form>

        <div id="tripResult" class="trip-result"></div>

    </section>

</main>

<footer>
    <h2>🏔️ TrekSmart</h2>
    <p>Explore More. Trek Smarter. Stay Safer.</p>
</footer>

<script src="trip-planner.js"></script>

</body>
</html>
